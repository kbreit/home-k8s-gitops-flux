apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spire-selfsigned
  namespace: cert-manager
spec:
  isCA: true
  commonName: spire-ca
  secretName: root-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
