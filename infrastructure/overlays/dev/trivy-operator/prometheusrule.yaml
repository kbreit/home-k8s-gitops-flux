apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator
  namespace: monitoring
  labels:
    # Required: this cluster's Prometheus has
    # ruleSelector.matchLabels.release=kube-prometheus-stack. Without this label
    # the rules are ignored silently.
    release: kube-prometheus-stack
spec:
  groups:
    - name: trivy-operator.rules
      rules:
        # Alerts count distinct images, not raw findings: the operator emits one
        # VulnerabilityReport per ReplicaSet/pod owner, so the same image shows up
        # many times across replicas and old ReplicaSets. max-by image collapses
        # those. Unfixed CVEs are excluded at the source (trivy.ignoreUnfixed in
        # the HelmRelease), so every finding counted here has a patched version.
        #
        # Critical: needs action, but `for: 24h` filters anything fixed by the
        # next rebuild/scan cycle.
        - alert: TrivyCriticalVulnerabilitiesFound
          expr: |
            count(max by (image_repository, image_tag) (trivy_image_vulnerabilities{severity="Critical"}) > 0) > 0
          for: 24h
          labels:
            severity: warning
            trivy_tier: critical
          annotations:
            summary: Trivy has found fixable Critical vulnerabilities
            description: >-
              {{ $value }} image(s) have fixable Critical vulnerabilities,
              sustained for over 24h. Per-image breakdown:
              sum by (image_repository, image_tag) (trivy_image_vulnerabilities{severity="Critical"}) > 0
              or: kubectl get vulnerabilityreports -A -o wide

        # High: lower urgency. `for: 7d` means it only fires for fixes that have
        # been available and unapplied for a week. trivy_tier=digest is a stable
        # label for an Alertmanager route with a long repeat_interval.
        - alert: TrivyHighVulnerabilitiesFound
          expr: |
            count(max by (image_repository, image_tag) (trivy_image_vulnerabilities{severity="High"}) > 0) > 0
          for: 7d
          labels:
            severity: info
            trivy_tier: digest
          annotations:
            summary: Trivy has found fixable High vulnerabilities
            description: >-
              {{ $value }} image(s) have fixable High vulnerabilities, sustained
              for over 7d. Per-image breakdown:
              sum by (image_repository, image_tag) (trivy_image_vulnerabilities{severity="High"}) > 0

        # Scanner-health check, independent of any assumed ServiceMonitor job
        # label (the exact job name depends on the chart's fullname template
        # and wasn't verified against a live cluster -- see rollout notes).
        # trivy_image_vulnerabilities is emitted by the operator itself once
        # any VulnerabilityReport exists; if the series vanishes entirely,
        # something broke the scan pipeline (blocked image pulls -- e.g. the
        # still-expired GHCR token on the ecommerce charts -- a Kyverno-denied
        # node-collector Job, or the operator/trivy-server crashing), and a
        # clean cluster becomes silently indistinguishable from a broken one.
        # 6h grace period covers first-install report generation.
        - alert: TrivyScanReportsAbsent
          expr: absent(trivy_image_vulnerabilities)
          for: 6h
          labels:
            severity: critical
          annotations:
            summary: No Trivy vulnerability report metrics found
            description: >-
              The trivy_image_vulnerabilities metric has had no series for
              over 6h. Either trivy-operator is not scanning anything, or its
              ServiceMonitor/metrics endpoint is broken. This is NOT the same
              as "no vulnerabilities found" -- check:
              kubectl get pods -n trivy-system
              kubectl get vulnerabilityreports -A

        # Heuristic job-name match (".*trivy.*") rather than an exact string:
        # the precise `job` label depends on the chart's generated Service
        # name, which was not verified against a live cluster. A wrong exact
        # string would silently never match -- see the Alertmanager
        # null-receiver and OTel CIDR-match precedents for how badly that
        # class of bug hides. Tighten to an exact job value once confirmed
        # with `up{namespace="trivy-system"}` in Prometheus.
        - alert: TrivyOperatorTargetDown
          expr: up{job=~".*trivy.*"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Trivy Operator metrics target is down
            description: >-
              Prometheus has failed to scrape a Trivy Operator target
              ({{ $labels.job }}) for over 15m.

        # Configuration audit findings (misconfigurations detected by Trivy's
        # config-audit scanner). Covers both Critical and High severity.
        # `for: 1h` provides reasonable alert delay without missing serious issues.
        - alert: TrivyConfigAuditHighSeverityFound
          expr: sum(trivy_resource_configaudits{severity=~"Critical|High"}) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Trivy has found High or Critical-severity misconfigurations
            description: >-
              trivy-operator has reported {{ $value }} High or Critical-severity
              misconfiguration findings (ConfigAuditReports) in scanned resources,
              sustained for over 1h. Investigate with:
              kubectl get configauditreports -A -o wide

        # RBAC assessment findings (privilege escalation risks detected by Trivy's
        # rbac-assessment scanner). Covers both Role and ClusterRole findings at
        # Critical and High severity. `for: 1h` provides reasonable alert delay.
        - alert: TrivyRBACAssessmentHighSeverityFound
          expr: sum(trivy_role_rbacassessments{severity=~"Critical|High"}) + sum(trivy_clusterrole_clusterrbacassessments{severity=~"Critical|High"}) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Trivy has found High or Critical-severity RBAC assessment findings
            description: >-
              trivy-operator has reported {{ $value }} High or Critical-severity
              RBAC assessment findings (RbacAssessmentReports) in scanned Roles
              and ClusterRoles, sustained for over 1h. Investigate with:
              kubectl get rbacassessmentreports -A -o wide
