# Manually-managed PodMonitor for the ecommerce-dev cluster.
#
# CNPG's Cluster.spec.monitoring.enablePodMonitor field is deprecated as of
# the operator version in this cluster (chart 0.29.0 / App v1.30.0) — CNPG
# now recommends hand-owning the PodMonitor instead of letting the operator
# generate one, since the generated one can't carry the `release` label our
# kube-prometheus-stack Prometheus requires for its podMonitorSelector.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ecommerce-dev
  namespace: cnpg-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: ecommerce-dev
  podMetricsEndpoints:
    - port: metrics
