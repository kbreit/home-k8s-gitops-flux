---
# Scrapes the six core Flux controllers (kustomize/helm/source/notification/
# image-reflector/image-automation), which all carry the label
# app.kubernetes.io/part-of=flux and expose Prometheus metrics on the
# "http-prom" container port (8080). These emit the gotk_* and
# controller_runtime_* series that power the Flux Grafana dashboards.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-controllers
  namespace: flux-system
  labels:
    # Picked up by this cluster's Prometheus (podMonitorSelector match).
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: flux
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app.kubernetes.io/part-of
        operator: In
        values:
          - flux
  podMetricsEndpoints:
    - port: http-prom
      # Avoid scraping pods that are terminating/pending.
      # https://github.com/prometheus-operator/prometheus-operator/issues/4816
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_phase]
          action: keep
          regex: Running
