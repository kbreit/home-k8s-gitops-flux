apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
configMapGenerator:
  - name: tls-expiry-dashboard
    files:
      - ./dashboards/tls-expiry-dashboard.json
  - name: x509-cert-expiry-dashboard
    files:
      - ./dashboards/x509-cert-expiry-dashboard.json
  - name: cnpg-dashboard
    files:
      - ./dashboards/cnpg-dashboard.json
  - name: traefik-dashboard
    files:
      - ./dashboards/traefik-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
