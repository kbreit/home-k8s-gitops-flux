apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  values:
    admissionController:
      replicas: 2
      # kbedge001 has the control-plane NoSchedule taint; without this toleration
      # both replicas can only land on kbedge002, defeating the anti-affinity
      # below and leaving the webhook fully dark whenever kbedge002 is drained.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      # podDisruptionBudget is auto-enabled by the chart once replicas > 1
      # (minAvailable: 1 default).
      #
      # The chart's own default anti-affinity is only "preferred" (weight 1),
      # which proved too weak in practice: with the toleration above, both
      # replicas landed on kbedge001 anyway, because kbedge002 carries far
      # more load (CNPG, ecommerce, monitoring) and the scheduler's resource
      # scoring outweighed the soft hint. On a 2-node cluster that defeats the
      # whole point (a single node loss still takes out both replicas), so
      # this forces a hard split instead.
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - admission-controller
            topologyKey: kubernetes.io/hostname
      # The chart's default RollingUpdate (maxSurge: 1) tries to run 3
      # admission-controller pods at once during a rollout (2 old + 1
      # surging new one) — with only 2 nodes and the hard anti-affinity
      # above, that 3rd pod can never schedule, so every future rollout
      # (chart bump, values change) deadlocks: Helm marks it Failed/stalled
      # and Flux rolls back, only to retry the same doomed upgrade again.
      # maxSurge: 0 keeps total pod count at 2 throughout the rollout
      # (terminate one old pod, its node frees up, schedule the new one
      # there, repeat) so there's never a 3-way scheduling conflict.
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
