apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: x509-exporter
  namespace: monitoring
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: x509-exporter
    namespace: flux-system
  values:
    prometheusServiceMonitor:
      create: true
      extraLabels:
        release: kube-prometheus-stack
