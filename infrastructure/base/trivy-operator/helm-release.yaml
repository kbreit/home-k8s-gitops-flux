apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 10m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chartRef:
    kind: OCIRepository
    name: trivy-operator
    namespace: flux-system
  values:
    # Chart 0.32.1 is the newest published chart but defaults to operator
    # 0.30.1 (grpc 1.78.0 / OpenSSL 3.5.5 criticals). Upstream's v0.35.0 chart
    # source (0.37.0, unpublished) only differs from 0.32.1 by PV/PVC RBAC and
    # PV/PVC config-audit kinds, so the old templates are safe for 0.35.0+ as
    # long as supportedConfigAuditKinds stays at the chart default. Drop this
    # and the trivy.image.tag below once a newer chart is published.
    # 0.36.1: 12 -> 2 High vs 0.35.0 (local scan, 2026-11-19).
    image:
      tag: "0.36.1"
    trivy:
      # Must be trivy.image.tag -- a bare trivy.tag is silently ignored (an
      # earlier override sat here unapplied). 0.76.2: 1C/24H -> 0C/7H vs
      # 0.75.0 (brotli CVE-2026-111497 critical).
      image:
        tag: "0.76.2"
      # Only report CVEs that have a fixed version available. Unfixed ones
      # (nothing actionable) are dropped from VulnerabilityReports entirely, so
      # they also won't show in `kubectl get vulnerabilityreports` or the Trivy
      # Grafana dashboard. Re-scan with this off to see the full list.
      ignoreUnfixed: true
      # Workaround for aquasecurity/trivy-operator#3022: the operator stores
      # VendorSeverity[SeveritySource] and writes UNKNOWN when Trivy leaves
      # SeveritySource empty (most Go module/stdlib CVEs), so reports under-count
      # HIGH/CRITICAL (Grafana 13.2.6: 2 reported vs 18 real). An explicit list
      # makes Trivy always set SeveritySource. Order is trivy-db's AllSourceIDs;
      # NVD first means NVD wins over distro ratings. Mounted into scan Jobs as
      # --config. Drop once #3117 or #3026 ships in an operator release.
      configFile:
        vulnerability:
          severity-source:
            - nvd
            - redhat
            - redhat-oval
            - debian
            - ubuntu
            - alpine
            - amazon
            - oracle-oval
            - suse-cvrf
            - photon
            - arch-linux
            - alma
            - rocky
            - cbl-mariner
            - azure
            - ruby-advisory-db
            - php-security-advisories
            - nodejs-security-wg
            - ghsa
            - glad
            - osv
            - k8s
            - wolfi
            - chainguard
            - bitnami
            - govulndb
            - julia
      # Trivy's YAML ignore format (selected by the .yaml file name), scoped
      # per finding + path rather than by bare ID. Applies to the
      # vulnerability/secret scan Jobs. Paths need the leading slash -- verified
      # with `trivy image --ignorefile` against the image (no slash = no match).
      ignoreFileName: .trivyignore.yaml
      ignoreFile:
        secrets:
          - id: private-key
            paths:
              - "/etc/ssl/private/ssl-cert-snakeoil.key"
            statement: >-
              Debian ssl-cert placeholder ("snakeoil") key baked into the
              upstream cloudnative-pg/postgresql image. Not used: Postgres
              runs with ssl_key_file=/controller/certificates/server.key
              (operator-issued). Not a leaked credential.
        # CoreDNS v1.14.7 false positives. The binary embeds the pseudo-version
        # v0.0.0-20260819003913-427fc80ed9ca, which is the v1.14.7 tag commit,
        # so Trivy can't compare it against the fixed versions (all <= 1.14.7).
        # The purl pins the exact version: on any CoreDNS bump these stop
        # matching and must be re-checked, not copied forward.
        vulnerabilities:
          - id: CVE-2023-28452
            purls: &coredns-1-14-7
              - "pkg:golang/github.com/coredns/coredns@v0.0.0-20260819003913-427fc80ed9ca"
            statement: CoreDNS false positive, fixed in 1.11.0 (running 1.14.7).
          - id: CVE-2024-0874
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.11.2 (running 1.14.7).
          - id: GHSA-gv9j-4w24-q7vx
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.6.6 (running 1.14.7).
          - id: CVE-2025-47950
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.12.2 (running 1.14.7).
          - id: CVE-2025-68151
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.0 (running 1.14.7).
          - id: CVE-2026-26017
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.2 (running 1.14.7).
          - id: CVE-2026-26018
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.2 (running 1.14.7).
          - id: CVE-2026-32934
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.3 (running 1.14.7).
          - id: CVE-2026-32936
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.3 (running 1.14.7).
          - id: CVE-2026-33190
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.3 (running 1.14.7).
          - id: CVE-2026-33489
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.3 (running 1.14.7).
          - id: CVE-2026-35579
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.3 (running 1.14.7).
          - id: CVE-2026-82399
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.7 (running 1.14.7).
          - id: CVE-2026-86003
            purls: *coredns-1-14-7
            statement: CoreDNS false positive, fixed in 1.14.7 (running 1.14.7).
      # This cluster has no cluster-wide default StorageClass (confirmed via
      # `kubectl get storageclass` -- only nfs-csi and nfs-csi-retain exist,
      # neither marked default), so the trivy-server StatefulSet's PVC was
      # left permanently unbound ("no persistent volumes available for this
      # claim and no storage class is set") until this was set explicitly.
      # nfs-csi (Delete reclaim), not nfs-csi-retain, since this is a
      # rebuildable vulnerability-DB cache, not data worth retaining.
      storageClassName: nfs-csi
    operator:
      # ClientServer mode via a single shared, in-cluster Trivy server, instead
      # of every scan Job downloading its own vulnerability DB copy. See
      # aquasecurity/trivy-operator#146 -- the chart default (standalone mode,
      # one DB pull per Job) is documented to overwhelm small clusters.
      builtInTrivyServer: true
      # Chart default is 10 concurrent scan Jobs; this is a resource-constrained
      # 2-node cluster (kbedge001/kbedge002), so cap it lower.
      scanJobsConcurrentLimit: 2
      # Deliberately left at the chart default (false). Per-CVE-ID metric series
      # is a cardinality bomb per the chart's own docs -- do not enable.
      # metricsVulnIdEnabled: false
    nodeCollector:
      # Without this, the node-collector DaemonSet/Jobs never run on the
      # control-plane node (kbedge001, tainted node-role.kubernetes.io/control-plane:
      # NoSchedule), so its CIS-benchmark checks are silently skipped there.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    serviceMonitor:
      enabled: true
      labels:
        # Required: this cluster's Prometheus has
        # serviceMonitorSelector matching release=kube-prometheus-stack. Without
        # this label the ServiceMonitor is silently ignored (bitten by omitting
        # this exact label twice already on other components).
        release: kube-prometheus-stack
