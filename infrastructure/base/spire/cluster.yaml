apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spire
  namespace: cnpg-system
spec:
  instances: 3 # 1 primary + 2 replicas
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  storage:
    size: 5Gi
    storageClass: nfs-csi-retain
  postgresql:
    parameters:
      max_connections: "200"
