apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-server
spec:
  interval: 10m
  # The old release (storage namespace "spire") owns the cluster-scoped objects
  # until Flux prunes it, so the first install attempts can fail on ownership.
  # Keep retrying until the old release is gone.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: spire
      version: "0.30.2"
      sourceRef:
        kind: HelmRepository
        name: spire
        namespace: flux-system
      interval: 10m
  values:
    spire-server:
      dataStore:
        sql:
          databaseType: postgres
          databaseName: spire
          host: spire-rw.cnpg-system.svc.cluster.local
          port: 5432
          username: app
          externalSecret:
            enabled: true
            name: spire-db-credentials
            key: password
    spire-agent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    spiffe-csi-driver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    upstreamAuthority:
      certManager:
        enabled: true
        issuer_name: my-ca-issuer
        issuer_kind: Issuer
        issuer_group: cert-manager.io
    global:
      spire:
        recommendations:
          enabled: true
        namespaces:
          create: false
          server:
            name: spire-server
          system:
            name: spire-system
        trustDomain: home.kevinbreit.net
        clusterName: breit-home
        persistence:
          storageClass: nfs-csi-retain
        caSubject:
          country: US
          organization: Kevin Breit Home
          commonName: home.kevinbreit.net
