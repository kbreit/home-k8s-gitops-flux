apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-server
spec:
  interval: 10m
  # The old release (storage namespace "spire") owns the cluster-scoped objects
  # until Flux prunes it, so the first install attempts can fail on ownership.
  # Keep retrying until the old release is gone.
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: spire
      version: "0.30.4"
      sourceRef:
        kind: HelmRepository
        name: spire
        namespace: flux-system
      interval: 10m
  values:
    spire-server:
      dataStore:
        sql:
          databaseType: postgres
          databaseName: spire
          host: spire-rw.cnpg-system.svc.cluster.local
          port: 5432
          username: app
          externalSecret:
            enabled: true
            name: spire-db-credentials
            key: password
      upstreamAuthority:
        certManager:
          enabled: true
          issuerName: my-ca-issuer
          issuerKind: ClusterIssuer
          issuerGroup: cert-manager.io
    spire-agent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    spiffe-csi-driver:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Chart 0.30.4 still defaults to csi-driver 0.2.7 and registrar v2.15.0
      # (Go stdlib CVE-2025-68121 + grpc CVE-2026-33186 criticals). 0.2.13 is the
      # latest 0.2.x; v2.17.0 matches what CSI NFS already runs. Drop these once
      # the chart defaults catch up.
      image:
        tag: "0.2.13"
      nodeDriverRegistrar:
        image:
          tag: v2.17.0
    spiffe-oidc-discovery-provider:
      # Chart default 0.11.0 carries the same two criticals; also used by the
      # init container. Drop once the chart default catches up.
      spiffeHelper:
        image:
          tag: 0.12.2
    global:
      spire:
        recommendations:
          enabled: true
        namespaces:
          create: false
          server:
            name: spire-server
          system:
            name: spire-system
        trustDomain: home.kevinbreit.net
        clusterName: breit-home
        persistence:
          storageClass: nfs-csi-retain
        caSubject:
          country: US
          organization: Kevin Breit Home
          commonName: home.kevinbreit.net
