apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire
spec:
  interval: 10m
  chart:
    spec:
      chart: spire
      version: "0.30.2"
      sourceRef:
        kind: HelmRepository
        name: spire
        namespace: flux-system
      interval: 10m
  values:
    spire-server:
      dataStore:
        sql:
          databaseType: postgres
          databaseName: spire
          host: spire-rw.cnpg-system.svc.cluster.local
          port: 5432
          username: app
          externalSecret:
            enabled: true
            name: spire-db-credentials
            key: password
    global:
      spire:
        recommendations:
          enabled: true
        namespaces:
          create: false
          server:
            name: spire
          system:
            name: spire
        trustDomain: home.kevinbreit.net
        clusterName: breit-home
        persistence:
          storageClass: nfs-csi-retain
        caSubject:
          country: US
          organization: Kevin Breit Home
          commonName: home.kevinbreit.net
