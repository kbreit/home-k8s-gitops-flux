apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire
spec:
  interval: 10m
  chart:
    spec:
      chart: spire
      version: "0.30.2"
      sourceRef:
        kind: HelmRepository
        name: spire
        namespace: flux-system
      interval: 10m
  values:
    global:
      spire:
        recommendations:
          enabled: true
        namespaces:
          create: false
          server:
            name: spire
          system:
            name: spire
        trustDomain: home.kevinbreit.net
        persistence:
          storageClass: nfs-csi-retain
        caSubject:
          country: US
          organization: Kevin Breit Home
          commonName: home.kevinbreit.net
