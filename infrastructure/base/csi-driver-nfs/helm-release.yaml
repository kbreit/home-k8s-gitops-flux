apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: csi-driver-nfs
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
      interval: 10m
      version: 4.13.6
  values:
    # Chart 4.13.6 (newest) defaults to older CSI sidecars carrying Go stdlib /
    # grpc Highs (csi-resizer v2.2.1: 26 High -> v2.3.0: 7). Drop these once
    # the chart defaults catch up.
    image:
      csiProvisioner:
        tag: v6.4.0
      csiResizer:
        tag: v2.3.0
      csiSnapshotter:
        tag: v8.7.0
      livenessProbe:
        tag: v2.20.0
      nodeDriverRegistrar:
        tag: v2.18.0
