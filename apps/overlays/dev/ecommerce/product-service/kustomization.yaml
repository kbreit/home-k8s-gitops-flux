apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/ecommerce/product-service
  - ./networkpolicy.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./database.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/semver
        value: "0.5.0"
    target:
      kind: OCIRepository
      name: product-service
  - patch: |-
      - op: replace
        path: /spec/values
        value:
          ingress:
            host: product.home.kevinbreit.net
          image:
            tag: "0.5.2"
          imagePullSecrets:
            - name: ghcr-token
          envFrom:
            - secretRef:
                name: user-service-secret
            - configMapRef:
                name: product-service-config
          migrate:
            enabled: true
            command:
              - ./migrate
          database:
            host: ecommerce-dev-rw.cnpg-system
            database: product-service
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          # Hardening for Trivy KSV-0001/0003/0014/0104/0118. Merges with the
          # chart's runAsNonRoot/runAsUser 1001 defaults; the container
          # securityContext also applies to the migrate init container.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # App writes nothing to its rootfs today; /tmp is a safety net for
          # readOnlyRootFilesystem (main container only, not migrate).
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
    target:
      kind: HelmRelease
      name: product-service
