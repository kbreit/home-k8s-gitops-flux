apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/ecommerce/frontend
  - ./networkpolicy.yaml
  - ./ciliumnetworkpolicy.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/semver
        value: "1.1.0"
    target:
      kind: OCIRepository
      name: frontend-service
  - patch: |-
      - op: replace
        path: /spec/values
        value:
          ingress:
            host: frontend.home.kevinbreit.net
          image:
            tag: "1.3.3"
          imagePullSecrets:
            - name: ghcr-token
          envFrom:
            - secretRef:
                name: user-service-secret
            - configMapRef:
                name: frontend-config
          database:
            host: ecommerce-dev-rw.cnpg-system
          volumes:
            - name: nginx-cache
              emptyDir: {}
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
          podSecurityContext:
            fsGroup: 1001
            sysctls:
              - name: net.ipv4.ip_unprivileged_port_start
                value: "0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
    target:
      kind: HelmRelease
      name: frontend-service
