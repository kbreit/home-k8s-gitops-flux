apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/ecommerce/frontend
  - ./networkpolicy.yaml
  - ./ciliumnetworkpolicy.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/semver
        value: "1.1.0"
    target:
      kind: OCIRepository
      name: frontend-service
  - patch: |-
      - op: replace
        path: /spec/values
        value:
          ingress:
            host: frontend.home.kevinbreit.net
          image:
            tag: "1.3.3"
          imagePullSecrets:
            - name: ghcr-token
          envFrom:
            - secretRef:
                name: user-service-secret
            - configMapRef:
                name: frontend-config
          database:
            host: ecommerce-dev-rw.cnpg-system
          volumes:
            - name: nginx-cache
              emptyDir: {}
            - name: nginx-run
              emptyDir: {}
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          # Workaround for frontend image hardcoding `listen 80;`/`pid /var/run/nginx.pid;`
          # in nginx.conf and ignoring $PORT (no envsubst template). TODO: fix the
          # Dockerfile (nginx-unprivileged base listening on 8080, or wire $PORT via a
          # real /etc/nginx/templates/*.template) and drop this sysctl + the two
          # emptyDir mounts above.
          podSecurityContext:
            fsGroup: 1001
            sysctls:
              - name: net.ipv4.ip_unprivileged_port_start
                value: "0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
    target:
      kind: HelmRelease
      name: frontend-service
