apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../base/ecommerce/user-service
  - ./user-service-secret.yaml
  - ./networkpolicy.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./database.yaml
patches:
  - patch: |-
      - op: replace
        path: /spec/ref/semver
        value: "1.9.0"
    target:
      kind: OCIRepository
      name: user-service
  - patch: |-
      - op: replace
        path: /spec/values
        value:
          ingress:
            host: user.home.kevinbreit.net
          image:
            tag: "1.5.4"
          imagePullSecrets:
            - name: ghcr-token
          envFrom:
            - secretRef:
                name: user-service-secret
            - configMapRef:
                name: user-service-config
          database:
            host: ecommerce-dev-rw.cnpg-system
            database: user-service
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12  # 60s total startup budget
          migrate:
            enabled: true
            command:
              - node
              - node_modules/.bin/typeorm
              - migration:run
              - -d
              - dist/config/database.js
          resources:
            limits:
              memory: 384Mi
            requests:
              memory: 384Mi
          # Hardening for Trivy KSV-0001/0003/0014/0104/0118. Merges with the
          # chart's runAsNonRoot/runAsUser 1001 defaults; the container
          # securityContext also applies to the migrate init container.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # App writes nothing to its rootfs today; /tmp is a safety net for
          # readOnlyRootFilesystem (main container only, not migrate).
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
    target:
      kind: HelmRelease
      name: user-service
